name: upil

services:
  postgres:
    image: postgres:16-alpine
    container_name: upil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upil}
      POSTGRES_USER: ${POSTGRES_USER:-upil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upil}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - upil

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: upil-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      # Windows/Hyper-V 会动态保留部分 18xxx-19xxx 端口；使用 29xxx 避免容器重启后绑定失败。
      - "29000:9000"
      # MinIO 控制台与 API 分开暴露，便于本机调试和对象检查。
      - "29001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - upil

  # uPil 的短期会话使用独立 Redis，不复用 RAGFlow 内部的 Redis/Valkey。
  # 两者拆开后，知识库升级、清理缓存或调整淘汰策略不会误伤客服会话。
  upil-redis:
    image: redis:7.4-alpine
    container_name: upil-redis
    restart: unless-stopped
    environment:
      # 密码来自未提交的根目录 .env；REDISCLI_AUTH 只供容器内健康检查使用，
      # 健康检查和脚本都不会把凭据拼进命令输出。
      UPIL_REDIS_PASSWORD: ${UPIL_REDIS_PASSWORD:?请在未提交的根目录 .env 中配置 UPIL_REDIS_PASSWORD}
      REDISCLI_AUTH: ${UPIL_REDIS_PASSWORD:?请在未提交的根目录 .env 中配置 UPIL_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$UPIL_REDIS_PASSWORD"
    ports:
      # 16379 已被 RAGFlow 使用；uPil 会话 Redis 单独映射到 16380。
      - "127.0.0.1:16380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli 自动读取 REDISCLI_AUTH；输出中不会出现密码。
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - upil

volumes:
  postgres_data:
    name: upil_postgres_data
  minio_data:
    name: upil_minio_data
  redis_data:
    name: upil_redis_data

networks:
  upil:
    name: upil_network
