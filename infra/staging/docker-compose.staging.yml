# uPil 本地 staging 编排文件。
# PostgreSQL、MinIO 和 RAGFlow 已由其他 Compose 管理，本文件只连接它们，
# 不重复声明或重建这些有状态服务，避免误删已有数据卷。
name: upil-staging

services:
  upil-api:
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile
      target: final
    # Docker 引擎启动后自动恢复 API；与核心 Redis、PostgreSQL、MinIO 的
    # unless-stopped 策略保持一致，同时仍允许开发者显式停止服务。
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env.staging
    environment:
      # 显式覆盖容器监听地址，避免沿用开发机默认值。
      APP_ENV: staging
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      # 仅绑定回环地址，staging API 不直接暴露到局域网。
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - upil_network

networks:
  # 外部网络由 D:\uPil\infra\docker-compose.yml 创建并维护。
  upil_network:
    external: true
    name: upil_network
