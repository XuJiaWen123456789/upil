  <rect width="1200" height="720" fill="#edf3f1"/>
  <rect y="430" width="1200" height="290" fill="#d8e2df"/>
  <rect x="110" y="150" width="980" height="340" rx="12" fill="#ffffff" stroke="#9fb4b0" stroke-width="5"/>
  <path d="M110 150h980l-55-90H165z" fill="#3f7880"/>
